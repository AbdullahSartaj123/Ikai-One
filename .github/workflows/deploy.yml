
name: Deploy Ikai.One to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # TEMPORARY: route live frontend auth/API calls to isolated staging while testing.
      # Restore https://api.ikai.one after validation is complete.
      - name: Build React website for staging API tests
        run: npm run build
        env:
          VITE_API_BASE_URL: https://ikai-one-api-staging.abdullah-sartaj-ahmad.workers.dev

      - name: Upload website to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: dist/
          server-dir: /htdocs/
          dangerous-clean-slate: false
