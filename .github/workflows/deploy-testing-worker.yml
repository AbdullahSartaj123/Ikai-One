name: Deploy Ikai.One Testing API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out prepared testing branch
        uses: actions/checkout@v4
        with:
          ref: phase-1/production-auth

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        working-directory: cloudflare-api
        run: npm install

      - name: Deploy isolated testing Worker
        working-directory: cloudflare-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.testing.toml

      - name: Configure testing database secret
        working-directory: cloudflare-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL_TESTING: ${{ secrets.DATABASE_URL_TESTING }}
        run: |
          if [ -z "$DATABASE_URL_TESTING" ]; then
            echo "Missing GitHub Actions secret DATABASE_URL_TESTING"
            exit 1
          fi
          printf '%s' "$DATABASE_URL_TESTING" | npx wrangler secret put DATABASE_URL --config wrangler.testing.toml
