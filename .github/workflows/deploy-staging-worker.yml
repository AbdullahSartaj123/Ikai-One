name: Deploy Ikai.One API to STAGING

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Safety confirmation — this workflow deploys only ikai-one-api-staging"
        required: true
        type: choice
        options:
          - staging

permissions:
  contents: read

concurrency:
  group: ikai-one-api-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: inputs.target == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging authentication branch
        uses: actions/checkout@v4
        with:
          ref: staging/phase1-auth

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        working-directory: cloudflare-api
        run: npm install

      - name: Confirm staging config targets the staging Worker
        working-directory: cloudflare-api
        shell: bash
        run: |
          grep -Eq '^name = "ikai-one-api-staging"$' wrangler.staging.toml
          grep -Eq '^DISABLE_EMAIL = "true"$' wrangler.staging.toml
          ! grep -Eq '^name = "ikai-one-api"$' wrangler.staging.toml

      - name: Deploy staging Worker only
        working-directory: cloudflare-api
        run: npx wrangler deploy --config wrangler.staging.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
