name: Deploy Ikai.One API to STAGING

on:
  push:
    branches: [security/b1-session-lifecycle-tests]
    paths:
      - ".github/workflows/deploy-staging-worker.yml"
      - "cloudflare-api/**"
  workflow_dispatch:
    inputs:
      target:
        description: "Safety confirmation — this workflow deploys only ikai-one-api-staging"
        required: true
        type: choice
        options:
          - staging

permissions:
  contents: read

concurrency:
  group: ikai-one-api-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.event_name == 'push' || inputs.target == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Check out this candidate branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        working-directory: cloudflare-api
        run: npm install

      - name: Run Worker tests
        working-directory: cloudflare-api
        run: npm test

      - name: Confirm staging config cannot target production
        working-directory: cloudflare-api
        shell: bash
        run: |
          grep -Eq '^name = "ikai-one-api-staging"$' wrangler.staging.toml
          ! grep -Eq '^name = "ikai-one-api"$' wrangler.staging.toml
          ! grep -Eq 'api\\.ikai\\.one|custom_domain|^routes' wrangler.staging.toml

      - name: Deploy staging Worker only
        working-directory: cloudflare-api
        run: npx wrangler deploy --config wrangler.staging.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify staging API health
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --retry 5 --retry-delay 3 --retry-all-errors \
            "https://ikai-one-api-staging.abdullah-sartaj-ahmad.workers.dev/health"
