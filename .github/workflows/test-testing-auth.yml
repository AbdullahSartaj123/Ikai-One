name: Test Ikai.One Testing Authentication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out prepared authentication code
        uses: actions/checkout@v4
        with:
          ref: phase-1/production-auth

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run isolated authentication smoke test
        env:
          TEST_HELPER_SECRET: ${{ secrets.TEST_HELPER_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://ikai-one-api-testing.abdullah-sartaj-ahmad.workers.dev';
          const secret = process.env.TEST_HELPER_SECRET;
          if (!secret) throw new Error('Missing TEST_HELPER_SECRET repository secret');
          const unique = `${Date.now()}-${process.env.GITHUB_RUN_ID || 'manual'}`;
          const email = `ikai-test-${unique}@example.invalid`;
          const password = `Test-${crypto.randomUUID()}-Safe!`;
          async function request(path, options = {}) {
            const response = await fetch(`${base}${path}`, options);
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { body = { raw: text.slice(0, 200) }; }
            return { response, body };
          }
          const forgot = await request('/api/auth/forgot-password', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          if (!forgot.response.ok || !/if a verified account exists/i.test(forgot.body?.message || '')) throw new Error(`Forgot-password response was not generic/successful (${forgot.response.status}): ${JSON.stringify(forgot.body)}`);
          console.log('PASS forgot-password endpoint returns a generic response');
          const invalidReset = await request('/api/auth/reset-password', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: 'invalid-reset-token-that-is-long-enough-to-check', password: 'New-Test-Password-123!' })
          });
          if (invalidReset.response.status !== 400) throw new Error(`Invalid reset token was not rejected as expected (status ${invalidReset.response.status}): ${JSON.stringify(invalidReset.body)}`);
          console.log('PASS invalid password-reset token rejected');
          const unknownVerification = await request('/api/auth/verify-email', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: crypto.randomUUID() + crypto.randomUUID() })
          });
          if (unknownVerification.response.status !== 400) throw new Error(`Unknown verification token was not rejected (${unknownVerification.response.status}): ${JSON.stringify(unknownVerification.body)}`);
          console.log('PASS unknown verification token rejected');
          const malformedJson = await request('/api/auth/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{invalid-json'
          });
          if (malformedJson.response.status !== 400) throw new Error(`Malformed JSON was not rejected with HTTP 400 (${malformedJson.response.status}): ${JSON.stringify(malformedJson.body)}`);
          console.log('PASS malformed JSON rejected cleanly');
          const registered = await request('/api/auth/register', {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Testing-Verification-Secret': secret },
            body: JSON.stringify({ email, password, fullName: 'Ikai Test User', companyName: `Ikai Test ${unique}`, businessType: 'shipper' })
          });
          if (registered.response.status !== 201) throw new Error(`Register failed (${registered.response.status}): ${JSON.stringify(registered.body)}`);
          if (registered.body.emailSent !== false) throw new Error('Expected email delivery to remain disabled');
          console.log('PASS registration created a test account; real email was not sent');
          const verified = await request('/api/testing/verify-email', {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Testing-Verification-Secret': secret },
            body: JSON.stringify({ email })
          });
          if (!verified.response.ok) throw new Error(`Test verification failed (${verified.response.status}): ${JSON.stringify(verified.body)}`);
          console.log('PASS testing-only verification helper');
          const unprotectedVerify = await request('/api/testing/verify-email', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          if (unprotectedVerify.response.status !== 404) throw new Error(`Testing verification helper was exposed without secret (status ${unprotectedVerify.response.status})`);
          console.log('PASS verification helper rejects requests without its secret');
          const badPassword = await request('/api/auth/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password: 'Definitely-Wrong-Password-123!' })
          });
          if (badPassword.response.status !== 401) throw new Error(`Wrong password was not rejected as expected (status ${badPassword.response.status}): ${JSON.stringify(badPassword.body)}`);
          console.log('PASS incorrect password rejected');
          const unauthShipments = await request('/api/shipments');
          if (unauthShipments.response.status !== 401) throw new Error(`Unauthenticated shipments request was not rejected (status ${unauthShipments.response.status})`);
          console.log('PASS unauthenticated shipments access rejected');
          const login = await request('/api/auth/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          if (!login.response.ok) throw new Error(`Login failed (${login.response.status}): ${JSON.stringify(login.body)}`);
          const cookies = login.response.headers.getSetCookie?.() || [];
          const sessionCookie = cookies.find(value => value.startsWith('__Host-ikai_session='));
          if (!sessionCookie) throw new Error('Login succeeded but session cookie was not set');
          const cookiePair = sessionCookie.split(';', 1)[0];
          console.log('PASS login issued an HttpOnly session cookie');
          const me = await request('/api/auth/me', { headers: { Cookie: cookiePair } });
          if (!me.response.ok || me.body?.user?.email !== email) throw new Error(`Session check failed (${me.response.status}): ${JSON.stringify(me.body)}`);
          console.log('PASS authenticated session check');
          const orgA = me.body?.user?.organizationId;
          if (!orgA) throw new Error('First test user has no organizationId');
          const secondEmail = `ikai-isolation-${unique}@example.invalid`;
          const secondPassword = `Test-${crypto.randomUUID()}-Safe!`;
          const secondRegistered = await request('/api/auth/register', {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Testing-Verification-Secret': secret },
            body: JSON.stringify({ email: secondEmail, password: secondPassword, fullName: 'Ikai Isolation User', companyName: `Ikai Isolation ${unique}`, businessType: 'shipper' })
          });
          if (secondRegistered.response.status !== 201) throw new Error(`Second organization registration failed (${secondRegistered.response.status}): ${JSON.stringify(secondRegistered.body)}`);
          const secondVerified = await request('/api/testing/verify-email', {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Testing-Verification-Secret': secret },
            body: JSON.stringify({ email: secondEmail })
          });
          if (!secondVerified.response.ok) throw new Error(`Second organization verification failed (${secondVerified.response.status}): ${JSON.stringify(secondVerified.body)}`);
          const secondLogin = await request('/api/auth/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: secondEmail, password: secondPassword })
          });
          if (!secondLogin.response.ok) throw new Error(`Second organization login failed (${secondLogin.response.status}): ${JSON.stringify(secondLogin.body)}`);
          const secondCookie = (secondLogin.response.headers.getSetCookie?.() || []).find(value => value.startsWith('__Host-ikai_session='));
          if (!secondCookie) throw new Error('Second organization login did not issue a session cookie');
          const secondCookiePair = secondCookie.split(';', 1)[0];
          const secondMe = await request('/api/auth/me', { headers: { Cookie: secondCookiePair } });
          if (!secondMe.response.ok || !secondMe.body?.user?.organizationId) throw new Error(`Second organization session check failed (${secondMe.response.status}): ${JSON.stringify(secondMe.body)}`);
          const orgB = secondMe.body.user.organizationId;
          if (orgA === orgB) throw new Error('Isolation setup failed: separate test accounts share the same organization');
          const [shipmentsA, shipmentsB] = await Promise.all([
            request('/api/shipments?limit=100', { headers: { Cookie: cookiePair } }),
            request('/api/shipments?limit=100', { headers: { Cookie: secondCookiePair } })
          ]);
          if (!shipmentsA.response.ok || !shipmentsB.response.ok) throw new Error(`Organization shipments requests failed (A:${shipmentsA.response.status}, B:${shipmentsB.response.status})`);
          const rowsA = shipmentsA.body?.data;
          const rowsB = shipmentsB.body?.data;
          if (!Array.isArray(rowsA) || !Array.isArray(rowsB)) throw new Error('Shipments endpoint did not return data arrays');
          for (const row of rowsA) if (String(row.organization_id) !== String(orgA)) throw new Error('Organization A received a shipment belonging to another organization');
          for (const row of rowsB) if (String(row.organization_id) !== String(orgB)) throw new Error('Organization B received a shipment belonging to another organization');
          const idsA = new Set(rowsA.map(row => String(row.id)));
          if (rowsB.some(row => idsA.has(String(row.id)))) throw new Error('The two organizations received overlapping shipment IDs');
          console.log(`PASS organization-scoped shipment listing (A:${rowsA.length} rows, B:${rowsB.length} rows; org IDs differ)`);
          const logout = await request('/api/auth/logout', { method: 'POST', headers: { Cookie: cookiePair } });
          if (!logout.response.ok) throw new Error(`Logout failed (${logout.response.status}): ${JSON.stringify(logout.body)}`);
          const afterLogout = await request('/api/auth/me', { headers: { Cookie: cookiePair } });
          if (afterLogout.response.status !== 401) throw new Error(`Session remained valid after logout (status ${afterLogout.response.status})`);
          console.log('PASS logout revoked session');
          let rateLimited = false;
          for (let attempt = 1; attempt <= 12; attempt++) {
            const rateCheck = await request('/api/auth/login', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: `rate-limit-${unique}@example.invalid`, password: 'Wrong-Password-123!' })
            });
            if (rateCheck.response.status === 429) {
              rateLimited = true;
              break;
            }
            if (![400, 401].includes(rateCheck.response.status)) {
              throw new Error(`Unexpected login rate-limit probe response (${rateCheck.response.status}): ${JSON.stringify(rateCheck.body)}`);
            }
          }
          if (!rateLimited) throw new Error('Login endpoint did not return HTTP 429 within 12 attempts');
          console.log('PASS login endpoint enforces its rate limit with HTTP 429');
          console.log(`Test account email: ${email}`);
          console.log('Note: test account remains in the Neon testing branch for now.');
          NODE