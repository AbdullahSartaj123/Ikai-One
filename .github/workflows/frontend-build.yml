name: Frontend build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run API and production SQL regression tests
        run: node --test cloudflare-api/tests/*.test.js
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
